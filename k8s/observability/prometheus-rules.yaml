apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-policy-service-alerts
  namespace: tfm-dev
  labels:
    release: monitoring
    app: demo-policy-service
    project: tfm
spec:
  groups:
    - name: demo-policy-service.rules
      rules:
        - alert: DemoPolicyServiceInstanceUnavailable
          expr: up{job="demo-policy-service"} == 0
          for: 1m
          labels:
            severity: critical
            environment: dev
            service: demo-policy-service
          annotations:
            summary: "Instancia de demo-policy-service no disponible"
            description: "Prometheus no puede recolectar métricas del pod {{ $labels.pod }} durante más de un minuto."

        - alert: DemoPolicyServiceHighCpu
          expr: process_cpu_usage{job="demo-policy-service"} * 100 > 80
          for: 5m
          labels:
            severity: warning
            environment: dev
            service: demo-policy-service
          annotations:
            summary: "Uso elevado de CPU en demo-policy-service"
            description: "El pod {{ $labels.pod }} mantiene un uso de CPU superior al 80 % durante más de cinco minutos."